<svg xmlns="http://www.w3.org/2000/svg" width="4500" height="5400" viewBox="0 0 4500 5400">
  <title>My Authentic Self Is Currently Being Monetized — two-ink front artwork</title>
  <desc>Independent transactional notice with an auction-style monetized status stamp.</desc>
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="2250" y="1570" fill="#171713" font-size="210" letter-spacing="30">MY AUTHENTIC SELF IS</text>
    <rect x="620" y="1960" width="3260" height="1180" fill="none" stroke="#171713" stroke-width="34"/><rect x="760" y="2100" width="2980" height="900" fill="#D9483B"/>
    <text x="2250" y="2710" fill="#F4EEDF" font-size="520" font-weight="800" letter-spacing="4" data-production="garment-color knockout; not a third ink">MONETIZED</text>
    <text x="2250" y="3520" fill="#171713" font-size="240" letter-spacing="22">CURRENTLY AVAILABLE</text>
    <line x1="1030" y1="3780" x2="3470" y2="3780" stroke="#171713" stroke-width="24"/>
    <text x="2250" y="4130" fill="#D9483B" font-size="105" letter-spacing="28">SPONSORSHIP SUBJECT TO TERMS</text>
    <text x="2250" y="4430" fill="#171713" font-size="86" letter-spacing="24">PERSONA MAY DIFFER FROM PERSON</text>
  </g>
</svg>
