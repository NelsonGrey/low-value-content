name: Functions CI

on:
  pull_request:
    paths: ["functions/**", ".github/workflows/functions-ci.yml"]
  push:
    branches: [develop, staging, main]
    paths: ["functions/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
