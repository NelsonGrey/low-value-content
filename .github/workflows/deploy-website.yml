name: Deploy Website

on:
  push:
    branches: [develop, staging, main]
    paths:
      - "website/dist/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # develop -> dev, staging -> staging, main -> prod
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Firebase project
        id: target
        run: |
          case "${GITHUB_REF_NAME}" in
            main)
              echo "project=low-value-content-prod" >> "$GITHUB_OUTPUT"
              echo "config=firebase.prod.json" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "project=low-value-content-staging" >> "$GITHUB_OUTPUT"
              echo "config=firebase.staging.json" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "project=low-value-content-dev" >> "$GITHUB_OUTPUT"
              echo "config=firebase.dev.json" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Select environment hosting policy
        run: cp "${{ steps.target.outputs.config }}" firebase.json
      - name: Write non-prod access-gate config
        if: github.ref_name != 'main'
        env:
          ALLOWED_EMAIL_DOMAINS: ${{ secrets.ALLOWED_EMAIL_DOMAINS }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
        run: |
          if [ -z "${ALLOWED_EMAIL_DOMAINS}${ALLOWED_EMAILS}" ]; then
            echo "::error::Set ALLOWED_EMAIL_DOMAINS and/or ALLOWED_EMAILS in this GitHub Environment (empty allowlist locks everyone out)."
            exit 1
          fi
          CONFIG=$(jq -nc \
            --arg domains "$ALLOWED_EMAIL_DOMAINS" --arg emails "$ALLOWED_EMAILS" \
            --arg apiKey "$FIREBASE_WEB_API_KEY" --arg appId "$FIREBASE_WEB_APP_ID" \
            '{domains: ($domains | split(",")), emails: ($emails | split(",")), apiKey: $apiKey, appId: $appId}')
          printf 'window.__ENV_GATE__ = %s;\n' "$CONFIG" > website/dist/assets/env-config.js
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ steps.target.outputs.project }}
          channelId: live
