name: Feature or content request
description: Suggest a new shirt concept, page, feature, or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to add or change?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter?
      description: Who benefits (customers, the brand, the business)?
