<svg xmlns="http://www.w3.org/2000/svg" width="4500" height="5400" viewBox="0 0 4500 5400">
  <title>Doomscrolling Market Research — two-ink front artwork</title>
  <desc>Front-only Royal Institute seal with the doomscrolling observation and a restrained House of Scroll endorsement.</desc>
  <defs>
    <mask id="clear-type-band"><rect width="4500" height="5400" fill="white"/><rect x="0" y="1950" width="4500" height="1500" fill="black"/></mask>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g mask="url(#clear-type-band)"><circle cx="2250" cy="2700" r="1780" stroke="#E7D9BA" stroke-width="42"/><circle cx="2250" cy="2700" r="1550" stroke="#C99B43" stroke-width="22"/></g>
    <path d="M1270 1780c520-440 1440-440 1960 0M1270 3620c520 440 1440 440 1960 0" stroke="#C99B43" stroke-width="24"/>
