<svg xmlns="http://www.w3.org/2000/svg" width="4500" height="5400" viewBox="0 0 4500 5400">
  <title>I have read and accepted nothing</title>
  <desc>Agreement checkbox above legal microtype.</desc>
<rect x="1810" y="1280" width="880" height="880" fill="none" stroke="#142B40" stroke-width="44"/>
  <path d="M1990 1730l220 230 330-500" fill="none" stroke="#852E34" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="2250" y="2760" fill="#142B40" font-family="Arial, Helvetica, sans-serif" font-size="330" font-weight="800" text-anchor="middle">I HAVE READ AND</text>
  <text x="2250" y="3140" fill="#142B40" font-family="Arial, Helvetica, sans-serif" font-size="330" font-weight="800" text-anchor="middle">ACCEPTED NOTHING.</text>
  <text x="700" y="3560" fill="#142B40" font-family="Georgia, 'Times New Roman', serif" font-size="76" textLength="3100" lengthAdjust="spacingAndGlyphs">1.1 The party of the first part agrees to nothing in particular.</text>
  <text x="700" y="3678" fill="#142B40" font-family="Georgia, 'Times New Roman', serif" font-size="76" textLength="3100" lengthAdjust="spacingAndGlyphs">1.2 The party of the second part has stopped reading.</text>
  <text x="700" y="3796" fill="#142B40" font-family="Georgia, 'Times New Roman', serif" font-size="76" textLength="3100" lengthAdjust="spacingAndGlyphs">2.1 Continued scrolling constitutes acceptance of continued scrolling.</text>
  <text x="700" y="3914" fill="#142B40" font-family="Georgia, 'Times New Roman', serif" font-size="76" textLength="3100" lengthAdjust="spacingAndGlyphs">2.2 Terms are subject to change without the courtesy of notice.</text>
  <text x="700" y="4032" fill="#142B40" font-family="Georgia, 'Times New Roman', serif" font-size="76" textLength="3100" lengthAdjust="spacingAndGlyphs">3.1 This agreement supersedes every agreement you have agreed to.</text>
  <text x="700" y="4150" fill="#142B40" font-family="Georgia, 'Times New Roman', serif" font-size="76" textLength="3100" lengthAdjust="spacingAndGlyphs">3.2 Please scroll down to the bottom. There is no bottom.</text>
  <text x="2250" y="4440" fill="#852E34" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="700" letter-spacing="14" text-anchor="middle">■  I AGREE TO THE TERMS OF THE TERMS</text>
  <g id="house-mark" transform="translate(2040 780) scale(4.2)" fill="none" stroke="#852E34" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M26 31a34 34 0 0 1 48 0M34 39a23 23 0 0 1 32 0M43 47a10 10 0 0 1 14 0"/><path d="M22 55h56v31H22zM38 86 50 96l12-10"/><circle cx="74" cy="56" r="9" fill="#852E34" stroke="none"/></g>
  <g id="house-frame">
    <g fill="none" stroke="#852E34"><rect x="250" y="400" width="4000" height="4650" stroke-width="34"/><rect x="335" y="485" width="3830" height="4480" stroke-width="11"/></g>
    <g fill="#852E34"><path d="M250 305l95 95-95 95-95-95z"/><path d="M4250 305l95 95-95 95-95-95z"/><path d="M250 4955l95 95-95 95-95-95z"/><path d="M4250 4955l95 95-95 95-95-95z"/><path d="M700 4800l60 60-60 60-60-60z"/><path d="M3800 4800l60 60-60 60-60-60z"/></g>
    <text x="2250" y="4850" fill="#852E34" font-family="Georgia, 'Times New Roman', serif" font-size="80" letter-spacing="26" text-anchor="middle">THE ROYAL HOUSE OF ENGAGEMENT · NO. 11</text>
  </g>
</svg>
