<svg xmlns="http://www.w3.org/2000/svg" width="4500" height="5400" viewBox="0 0 4500 5400">
  <title>My privacy has ads</title>
  <desc>Privacy-settings panel with a sponsored banner.</desc>
<text x="2250" y="1560" fill="#F4EEDF" font-family="Georgia, 'Times New Roman', serif" font-size="440" font-weight="700" text-anchor="middle">MY PRIVACY</text>
  <text x="2250" y="2060" fill="#C99B43" font-family="Georgia, 'Times New Roman', serif" font-size="440" font-weight="700" text-anchor="middle">HAS ADS.</text>
  <rect x="760" y="2450" width="2980" height="1700" fill="none" stroke="#F4EEDF" stroke-width="26"/>
  <text x="900" y="2640" fill="#F4EEDF" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="700" letter-spacing="20" text-anchor="start">PRIVACY SETTINGS</text>
  <text x="900" y="2910" fill="#F4EEDF" font-family="Georgia, 'Times New Roman', serif" font-size="110" text-anchor="start">Share my data</text>
  <rect x="3150" y="2840" width="400" height="110" rx="55" fill="#C99B43"/><circle cx="3495" cy="2895" r="42" fill="#142B40"/>
  <text x="900" y="3240" fill="#F4EEDF" font-family="Georgia, 'Times New Roman', serif" font-size="110" text-anchor="start">Share my data again</text>
  <rect x="3150" y="3170" width="400" height="110" rx="55" fill="#C99B43"/><circle cx="3495" cy="3225" r="42" fill="#142B40"/>
  <text x="900" y="3570" fill="#F4EEDF" font-family="Georgia, 'Times New Roman', serif" font-size="110" text-anchor="start">Share my data (recommended)</text>
  <rect x="3150" y="3500" width="400" height="110" rx="55" fill="#C99B43"/><circle cx="3495" cy="3555" r="42" fill="#142B40"/>
  <g transform="rotate(-5 2250 3250)"><rect x="520" y="3050" width="3460" height="330" fill="#C99B43"/><text x="2250" y="3270" fill="#142B40" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="800" letter-spacing="14" text-anchor="middle">SPONSORED · YOUR PRIVACY IS OUR PRIORITY*</text></g>
  <text x="2250" y="4440" fill="#C99B43" font-family="Arial, Helvetica, sans-serif" font-size="84" letter-spacing="18" text-anchor="middle">*SPONSORED BY OUR PARTNERS · 4,127 OF THEM</text>
  <g id="house-mark" transform="translate(2040 780) scale(4.2)" fill="none" stroke="#C99B43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M26 31a34 34 0 0 1 48 0M34 39a23 23 0 0 1 32 0M43 47a10 10 0 0 1 14 0"/><path d="M22 55h56v31H22zM38 86 50 96l12-10"/><circle cx="74" cy="56" r="9" fill="#C99B43" stroke="none"/></g>
  <g id="house-frame">
    <g fill="none" stroke="#C99B43"><rect x="250" y="400" width="4000" height="4650" stroke-width="34"/><rect x="335" y="485" width="3830" height="4480" stroke-width="11"/></g>
    <g fill="#C99B43"><path d="M250 305l95 95-95 95-95-95z"/><path d="M4250 305l95 95-95 95-95-95z"/><path d="M250 4955l95 95-95 95-95-95z"/><path d="M4250 4955l95 95-95 95-95-95z"/><path d="M700 4800l60 60-60 60-60-60z"/><path d="M3800 4800l60 60-60 60-60-60z"/></g>
    <text x="2250" y="4850" fill="#C99B43" font-family="Georgia, 'Times New Roman', serif" font-size="80" letter-spacing="26" text-anchor="middle">THE ROYAL HOUSE OF ENGAGEMENT · NO. 12</text>
  </g>
</svg>
