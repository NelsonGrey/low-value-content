  <g fill="none" stroke="#142B40" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" transform="translate(2650 2980)"><circle cx="500" cy="140" r="110"/><path d="M500 250v420M320 330h360M500 670l-120 330M500 670l120 330"/></g>
