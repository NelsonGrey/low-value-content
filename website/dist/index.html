<!doctype html>
<html lang="en">
<head>

  <style>
    :root { --bg: #f6f4ef; --fg: #1a1a1a; --muted: #5a5a5a; }

    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 36rem; text-align: center; }
    h1 { font-size: clamp(2.25rem, 8vw, 4rem); line-height: 1.05; margin: 0 0 1rem; letter-spacing: -0.02em; text-transform: uppercase; }
    p { color: var(--muted); font-size: 1.125rem; margin: 0.5rem 0; }
    footer { margin-top: 2rem; font-size: 0.8125rem; color: var(--muted); }
  </style>
</head>
