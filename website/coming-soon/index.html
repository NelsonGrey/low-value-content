<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Low Value Content | Coming soon</title>
  <meta name="description" content="Premium editorial T-shirts for people who have seen enough of the internet. Coming soon.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#d8ff43">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    :root { --ink:#171713; --lime:#d8ff43; --paper:#f1eddf; --red:#e54a2e; --muted:#6d6b61; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { min-height: 100vh; display: flex; flex-direction: column; background: var(--lime); color: var(--ink); font: 400 1.0625rem/1.55 "DM Sans", Arial, Helvetica, sans-serif; }
    main { flex: 1; display: grid; place-items: center; padding: clamp(1.25rem, 5vw, 4rem) 1rem; }
    .card { width: min(100%, 42rem); padding: clamp(1.75rem, 5vw, 3.5rem); border: 1px solid var(--ink); background: var(--paper); box-shadow: 14px 14px 0 var(--ink); }
    .mark { width: 4.5rem; height: 4.5rem; margin-bottom: 1.75rem; }
    .eyebrow { margin: 0 0 1rem; font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0 0 1.25rem; font: 400 clamp(2.5rem, 8vw, 4.25rem)/.9 "DM Serif Display", Georgia, serif; letter-spacing: -.04em; }
    h1 em { color: var(--red); font-style: normal; }
    p { margin: 0 0 1rem; }
    .lead { max-width: 32rem; color: var(--muted); font-size: 1.15rem; }
    .stamp { display: inline-block; margin-top: .75rem; padding: .7rem 1.2rem; border: 1px solid var(--ink); background: var(--ink); color: #fff; font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    footer { padding: 1.1rem 1rem; background: var(--ink); color: rgba(255,255,255,.75); text-align: center; font-size: .8125rem; }
    @media (max-width: 520px) { .card { box-shadow: 8px 8px 0 var(--ink); } }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <img class="mark" src="assets/iconmark-11-content-cocktail.svg" alt="">
      <p class="eyebrow">Low Value Content</p>
      <h1>The internet has produced <em>enough content.</em></h1>
      <p class="lead">Premium editorial T-shirts for people who have seen enough of the internet. Engagement pending. Please allow 3&ndash;5 business days for relevance.</p>
      <span class="stamp">Coming soon</span>
    </section>
  </main>
  <footer>&copy; 2026 Low Value Content, an imprint of Nelson Grey LLC. All rights reserved.</footer>
</body>
</html>
